<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="795" viewBox="0 0 1168 795" role="img" aria-label="Technical Stack">

<style>
:root{
  --bg:#f4f7fb;
  --grid:#dfe6ef;
  --card:#ffffff;
  --panel:#edf6f9;
  --ink:#17233d;
  --muted:#64738d;
  --blue:#415bb6;
  --teal:#118792;
  --violet:#7f6ab6;
  --line:#cfd8e5;
  --soft:#e8eefb;
}
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes drift{to{stroke-dashoffset:-120}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes softmove{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
    <path d="M72 0H0V72" fill="none" stroke="var(--grid)" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#5f718c" flood-opacity=".10"/>
  </filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fb"/>
    <stop offset=".72" stop-color="#eef6fb"/>
    <stop offset="1" stop-color="#eaf8f5"/>
  </linearGradient>
  <linearGradient id="wash2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dfeafa"/>
    <stop offset="1" stop-color="#dff5f1"/>
  </linearGradient>
</defs>

<rect width="1168" height="795" fill="var(--bg)"/>
<rect width="1168" height="795" fill="url(#grid)" opacity=".9"/>
<text x="31" y="37" class="mono" font-size="14" font-weight="800" letter-spacing="4" fill="var(--teal)">02 / WORKING TOOLKIT</text>
<text x="280" y="46" class="serif" font-size="35" font-weight="700">Technical Stack</text>
<line x1="525" y1="32" x2="1145" y2="32" stroke="var(--line)"/>
<g filter="url(#shadow)">
  <rect x="34" y="90" width="1098" height="666" rx="28" fill="var(--card)" stroke="var(--line)"/>
</g>

<text x="77" y="157" font-size="18" font-weight="700" letter-spacing="1.4" fill="#20386f">LANGUAGES</text>
<text x="363" y="174" font-size="23" font-weight="700" fill="var(--blue)">C+</text><text x="401" y="174" font-size="17" fill="var(--muted)">C++</text>
<text x="575" y="174" font-size="24" fill="var(--blue)">♨</text><text x="609" y="174" font-size="17" fill="var(--muted)">Java</text>
<text x="779" y="174" font-size="24" font-weight="700" fill="var(--blue)">Py</text><text x="815" y="174" font-size="17" fill="var(--muted)">Python</text>
<text x="363" y="249" font-size="21" font-weight="700" fill="var(--blue)">JS</text><text x="400" y="249" font-size="17" fill="var(--muted)">JavaScript</text>
<text x="573" y="249" font-size="20" font-weight="700" fill="var(--blue)">SQL</text><text x="609" y="249" font-size="17" fill="var(--muted)">SQL</text>
<line x1="53" y1="299" x2="1119" y2="299" stroke="var(--line)"/>

<text x="77" y="348" font-size="18" font-weight="700" letter-spacing="1.4" fill="#20386f">FRONTEND</text>
<text x="362" y="368" font-size="22" font-weight="700" fill="var(--blue)">H5</text><text x="402" y="368" font-size="17" fill="var(--muted)">HTML5</text>
<text x="571" y="368" font-size="22" font-weight="700" fill="var(--blue)">C3</text><text x="609" y="368" font-size="17" fill="var(--muted)">CSS3</text>
<text x="777" y="368" font-size="21" font-weight="700" fill="var(--blue)">JS</text><text x="813" y="368" font-size="17" fill="var(--muted)">JavaScript</text>
<line x1="53" y1="420" x2="1119" y2="420" stroke="var(--line)"/>

<text x="77" y="469" font-size="18" font-weight="700" letter-spacing="1.4" fill="#20386f">BACKEND</text>
<text x="363" y="490" font-size="23" fill="var(--blue)">◔</text><text x="401" y="490" font-size="17" fill="var(--muted)">Flask</text>
<text x="571" y="490" font-size="26" font-weight="700" fill="var(--muted)">{ }</text><text x="618" y="490" font-size="17" fill="var(--muted)">REST APIs</text>
<line x1="53" y1="549" x2="1119" y2="549" stroke="var(--line)"/>

<text x="77" y="598" font-size="18" font-weight="700" letter-spacing="1.4" fill="#20386f">AI / DATA</text>
<text x="363" y="624" font-size="24" fill="var(--muted)">✣</text><text x="410" y="624" font-size="17" fill="var(--muted)">Machine Learning</text>
<text x="596" y="624" font-size="22" fill="var(--muted)">⧉</text><text x="644" y="624" font-size="17" fill="var(--muted)">NLP</text>
<text x="804" y="624" font-size="22" font-weight="700" fill="var(--blue)">N</text><text x="843" y="624" font-size="17" fill="var(--muted)">NumPy</text>
<text x="365" y="704" font-size="22" font-weight="700" fill="var(--blue)">P</text><text x="402" y="704" font-size="17" fill="var(--muted)">Pandas</text>
<text x="570" y="704" font-size="21" fill="var(--muted)">⌗</text><text x="617" y="704" font-size="17" fill="var(--muted)">Sentence Transformers</text>

</svg>