<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="469" viewBox="0 0 1168 469" role="img" aria-label="Technical Profile">

<style>
:root{
  --bg:#f4f7fb;
  --grid:#dfe6ef;
  --card:#ffffff;
  --panel:#edf6f9;
  --ink:#17233d;
  --muted:#64738d;
  --blue:#415bb6;
  --teal:#118792;
  --violet:#7f6ab6;
  --line:#cfd8e5;
  --soft:#e8eefb;
}
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes drift{to{stroke-dashoffset:-120}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes softmove{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
    <path d="M72 0H0V72" fill="none" stroke="var(--grid)" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#5f718c" flood-opacity=".10"/>
  </filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fb"/>
    <stop offset=".72" stop-color="#eef6fb"/>
    <stop offset="1" stop-color="#eaf8f5"/>
  </linearGradient>
  <linearGradient id="wash2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dfeafa"/>
    <stop offset="1" stop-color="#dff5f1"/>
  </linearGradient>
</defs>

<rect width="1168" height="469" fill="var(--bg)"/>
<rect width="1168" height="469" fill="url(#grid)" opacity=".9"/>
<text x="30" y="52" class="mono" font-size="14" font-weight="800" letter-spacing="4" fill="var(--teal)">01 / TECHNICAL DIRECTION</text>
<text x="321" y="61" class="serif" font-size="36" font-weight="700">Technical Profile</text>
<line x1="584" y1="47" x2="1140" y2="47" stroke="var(--line)"/>

<g filter="url(#shadow)">
  <rect x="31" y="106" width="539" height="300" rx="27" fill="var(--card)" stroke="var(--line)"/>
  <rect x="594" y="106" width="539" height="300" rx="27" fill="var(--card)" stroke="var(--line)"/>
</g>
<text x="72" y="164" font-size="19" font-weight="700" letter-spacing="1.5" fill="var(--blue)">FOCUS</text>
<circle cx="78" cy="217" r="6" fill="var(--teal)"/><text x="100" y="223" font-size="20" font-weight="700">AI Full Stack Development</text>
<circle cx="78" cy="262" r="6" fill="var(--teal)"/><text x="100" y="268" font-size="20" font-weight="700">Backend Engineering</text>
<circle cx="78" cy="307" r="6" fill="var(--teal)"/><text x="100" y="313" font-size="20" font-weight="700">Applied AI / ML</text>

<text x="636" y="164" font-size="19" font-weight="700" letter-spacing="1.5" fill="var(--blue)">FOUNDATION</text>
<circle cx="642" cy="217" r="6" fill="var(--violet)"/><text x="664" y="223" font-size="20" font-weight="700">Data Structures &amp; Algorithms</text>
<circle cx="642" cy="262" r="6" fill="var(--violet)"/><text x="664" y="268" font-size="20" font-weight="700">Object-Oriented Programming</text>
<circle cx="642" cy="307" r="6" fill="var(--violet)"/><text x="664" y="313" font-size="20" font-weight="700">DBMS</text>
<circle cx="642" cy="352" r="6" fill="var(--violet)"/><text x="664" y="358" font-size="20" font-weight="700">Operating Systems</text>

</svg>