<svg xmlns="http://www.w3.org/2000/svg" width="1189" height="581" viewBox="0 0 1189 581" role="img" aria-label="Selected Work Tutor AI">

<style>
:root{
  --bg:#f4f7fb;
  --grid:#dfe6ef;
  --card:#ffffff;
  --panel:#edf6f9;
  --ink:#17233d;
  --muted:#64738d;
  --blue:#415bb6;
  --teal:#118792;
  --violet:#7f6ab6;
  --line:#cfd8e5;
  --soft:#e8eefb;
}
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes drift{to{stroke-dashoffset:-120}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes softmove{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
    <path d="M72 0H0V72" fill="none" stroke="var(--grid)" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#5f718c" flood-opacity=".10"/>
  </filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fb"/>
    <stop offset=".72" stop-color="#eef6fb"/>
    <stop offset="1" stop-color="#eaf8f5"/>
  </linearGradient>
  <linearGradient id="wash2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dfeafa"/>
    <stop offset="1" stop-color="#dff5f1"/>
  </linearGradient>
</defs>

<rect width="1189" height="581" fill="var(--bg)"/>
<rect width="1189" height="581" fill="url(#grid)" opacity=".9"/>
<text x="29" y="36" class="mono" font-size="14" font-weight="800" letter-spacing="4" fill="var(--teal)">03 / PROJECT EVIDENCE</text>
<text x="286" y="45" class="serif" font-size="35" font-weight="700">Selected Work</text>
<line x1="513" y1="31" x2="1163" y2="31" stroke="var(--line)"/>

<g filter="url(#shadow)"><rect x="30" y="89" width="1103" height="492" rx="29" fill="url(#wash)" stroke="var(--line)"/></g>
<text x="78" y="155" class="mono" font-size="14" font-weight="800" letter-spacing="4" fill="var(--teal)">01 / FLAGSHIP PROJECT</text>
<text x="78" y="212" class="serif" font-size="27" font-weight="700">Tutor AI</text>
<text x="79" y="250" font-size="21" font-weight="700" fill="var(--blue)">AI-powered intelligent learning platform</text>
<text x="79" y="304" font-size="18" fill="var(--muted)">Tutor AI addresses the need for accessible, contextual learning support by pairing a structured full-stack</text>
<text x="79" y="329" font-size="18" fill="var(--muted)">interface with AI-assisted explanations. I built the application workflow, backend endpoints, and NLP-</text>
<text x="79" y="354" font-size="18" fill="var(--muted)">driven response layer to make learning interactions more useful and adaptive.</text>

<text x="79" y="414" font-size="21" font-weight="700" fill="var(--teal)">Py</text><text x="114" y="414" font-size="16" fill="var(--muted)">Python</text>
<text x="180" y="414" font-size="21" fill="var(--teal)">◔</text><text x="214" y="414" font-size="16" fill="var(--muted)">Flask</text>
<text x="265" y="414" font-size="22" fill="var(--muted)">✣</text><text x="310" y="414" font-size="16" fill="var(--muted)">NLP</text>
<text x="354" y="414" font-size="24" fill="var(--muted)">{ }</text><text x="397" y="414" font-size="16" fill="var(--muted)">REST APIs</text>

<text x="79" y="490" font-size="16" font-weight="700" fill="var(--teal)">View Repository</text>
<path d="M229 479h18v18M247 479l-18 18" fill="none" stroke="var(--teal)" stroke-width="3"/>

</svg>