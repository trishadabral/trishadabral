<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="296" viewBox="0 0 1168 296" role="img" aria-label="Developer Tools">

<style>
:root{
  --bg:#f4f7fb;
  --grid:#dfe6ef;
  --card:#ffffff;
  --panel:#edf6f9;
  --ink:#17233d;
  --muted:#64738d;
  --blue:#415bb6;
  --teal:#118792;
  --violet:#7f6ab6;
  --line:#cfd8e5;
  --soft:#e8eefb;
}
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes drift{to{stroke-dashoffset:-120}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes softmove{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
    <path d="M72 0H0V72" fill="none" stroke="var(--grid)" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#5f718c" flood-opacity=".10"/>
  </filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fb"/>
    <stop offset=".72" stop-color="#eef6fb"/>
    <stop offset="1" stop-color="#eaf8f5"/>
  </linearGradient>
  <linearGradient id="wash2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dfeafa"/>
    <stop offset="1" stop-color="#dff5f1"/>
  </linearGradient>
</defs>

<rect width="1168" height="296" fill="var(--bg)"/>
<rect width="1168" height="296" fill="url(#grid)" opacity=".5"/>
<g filter="url(#shadow)"><rect x="21" y="2" width="1103" height="218" rx="0 0 28 28" fill="var(--card)" stroke="var(--line)"/></g>
<text x="64" y="52" font-size="18" font-weight="700" letter-spacing="1.4" fill="#20386f">DEVELOPER TOOLS</text>
<text x="350" y="72" font-size="22" font-weight="700" fill="var(--blue)">◆</text><text x="389" y="72" font-size="17" fill="var(--muted)">Git</text>
<text x="557" y="72" font-size="22" font-weight="700" fill="var(--blue)">●</text><text x="596" y="72" font-size="17" fill="var(--muted)">GitHub</text>
<text x="762" y="72" font-size="24" font-weight="700" fill="var(--blue)">⌁</text><text x="803" y="72" font-size="17" fill="var(--muted)">VS Code</text>
<text x="350" y="148" font-size="21" font-weight="700" fill="var(--blue)">IJ</text><text x="389" y="148" font-size="17" fill="var(--muted)">IntelliJ IDEA</text>
<text x="557" y="148" font-size="24" fill="var(--muted)">▣</text><text x="604" y="148" font-size="17" fill="var(--muted)">PyMuPDF</text>

</svg>