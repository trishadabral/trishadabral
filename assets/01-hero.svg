<svg xmlns="http://www.w3.org/2000/svg" width="1168" height="835" viewBox="0 0 1168 835" role="img" aria-label="Trisha Dabral engineering portfolio hero">

<style>
:root{
  --bg:#f4f7fb;
  --grid:#dfe6ef;
  --card:#ffffff;
  --panel:#edf6f9;
  --ink:#17233d;
  --muted:#64738d;
  --blue:#415bb6;
  --teal:#118792;
  --violet:#7f6ab6;
  --line:#cfd8e5;
  --soft:#e8eefb;
}
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes drift{to{stroke-dashoffset:-120}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes softmove{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
    <path d="M72 0H0V72" fill="none" stroke="var(--grid)" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#5f718c" flood-opacity=".10"/>
  </filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fb"/>
    <stop offset=".72" stop-color="#eef6fb"/>
    <stop offset="1" stop-color="#eaf8f5"/>
  </linearGradient>
  <linearGradient id="wash2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dfeafa"/>
    <stop offset="1" stop-color="#dff5f1"/>
  </linearGradient>
</defs>

<rect width="1168" height="835" fill="var(--bg)"/>
<rect width="1168" height="835" fill="url(#grid)" opacity=".9"/>

<g filter="url(#shadow)">
  <rect x="39" y="32" width="1104" height="61" rx="20" fill="rgba(255,255,255,.94)" stroke="var(--line)"/>
</g>
<circle cx="70" cy="62" r="12" fill="#dff2f1"/>
<circle cx="70" cy="62" r="6" fill="var(--teal)"/>
<text x="92" y="68" class="mono" font-size="15" font-weight="700" letter-spacing="2">TRISHA DABRAL</text>
<text x="696" y="68" font-size="16" fill="var(--muted)">Profile</text>
<text x="769" y="68" font-size="16" fill="var(--muted)">Stack</text>
<text x="838" y="68" font-size="16" fill="var(--muted)">Selected Work</text>
<text x="975" y="68" font-size="16" fill="var(--muted)">Signals</text>
<text x="1052" y="68" font-size="16" fill="var(--muted)">Connect</text>

<g filter="url(#shadow)">
  <rect x="39" y="130" width="1104" height="703" rx="38" fill="url(#wash)" stroke="var(--line)"/>
</g>

<text x="111" y="220" class="mono" font-size="14" font-weight="800" letter-spacing="4" fill="var(--teal)">ENGINEERING PORTFOLIO</text>
<text x="112" y="298" class="serif" font-size="42" font-weight="700">Trisha Dabral</text>
<text x="112" y="357" font-size="36" font-weight="700" fill="var(--blue)">AI Full Stack Developer</text>
<text x="112" y="422" font-size="21" fill="var(--muted)">Building intelligent, scalable applications across Full Stack Development and AI/ML.</text>
<text x="112" y="499" class="mono" font-size="17" font-weight="800" fill="var(--teal)">Direction /</text>
<text x="238" y="489" font-size="18" font-weight="700">AI / Machine Learning</text>

<g transform="translate(155 566)">
  <circle cx="260" cy="170" r="126" fill="none" stroke="var(--line)" stroke-width="1.4"/>
  <circle cx="260" cy="170" r="64" fill="none" stroke="var(--line)" stroke-width="1.4"/>
  <g fill="none" stroke="var(--teal)" stroke-width="1.35" stroke-dasharray="5 9" opacity=".52" style="animation:drift 17s linear infinite">
    <path d="M52 237 L150 120 L260 170 L402 102 L480 180"/>
    <path d="M52 237 L140 270 L260 170 L368 265 L480 180"/>
    <path d="M150 120 L140 270"/>
    <path d="M402 102 L368 265"/>
  </g>
  <g fill="none" stroke="var(--blue)" stroke-width="1.2" stroke-dasharray="5 9" opacity=".30" style="animation:drift 20s linear infinite reverse">
    <path d="M150 120 L260 250 L402 102"/>
    <path d="M140 270 L260 170 L368 265"/>
  </g>
  <circle cx="52" cy="237" r="9" fill="var(--teal)"/>
  <circle cx="150" cy="120" r="10" fill="var(--blue)"/>
  <circle cx="402" cy="102" r="9" fill="var(--violet)"/>
  <circle cx="480" cy="180" r="10" fill="var(--teal)"/>
  <circle cx="260" cy="170" r="14" fill="var(--teal)"/>
  <circle cx="205" cy="147" r="6" fill="var(--teal)" opacity=".5" style="animation:pulse 4.5s ease-in-out infinite"/>
  <circle cx="432" cy="149" r="6" fill="var(--teal)" opacity=".55" style="animation:pulse 5s ease-in-out infinite .8s"/>
  <g transform="translate(210 204)" style="animation:floaty 5.5s ease-in-out infinite">
    <rect x="0" y="0" width="98" height="52" rx="12" fill="#f7fbff" stroke="#9fb0e0" stroke-width="2"/>
    <path d="M19 26h20m12 0h22" stroke="var(--teal)" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M20 17h54" stroke="#d3dded" stroke-width="2"/>
  </g>
</g>

</svg>