<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" role="img">

<style>
  :root{
    --ink:#15213a;--muted:#5d6b80;--indigo:#4257a8;--teal:#187f83;--violet:#7962aa;
    --line:#cfd7e6;--soft:#f6f8fc;--panel:#ffffff;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --ink:#edf3ff;--muted:#aebcd0;--indigo:#9cafff;--teal:#79d7d1;--violet:#cbb5ff;
      --line:#33415f;--soft:#101827;--panel:#172134;
    }
  }
  text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--ink)}
  .muted{fill:var(--muted)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .line{stroke:var(--line)}
  .indigo{stroke:var(--indigo);fill:none}
  .teal{stroke:var(--teal);fill:none}
  .violet{stroke:var(--violet);fill:none}
  .fill-indigo{fill:var(--indigo)}
  .fill-teal{fill:var(--teal)}
  .fill-violet{fill:var(--violet)}
  @keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
  @keyframes dash{to{stroke-dashoffset:-48}}
  @keyframes blink{0%,46%,54%,100%{opacity:1}50%{opacity:.15}}
  @keyframes drift{0%,100%{transform:translateX(0)}50%{transform:translateX(8px)}}
  @keyframes scan{0%{transform:translateX(-40px);opacity:0}20%{opacity:.7}80%{opacity:.7}100%{transform:translateX(260px);opacity:0}}
  @media (prefers-reduced-motion: reduce){
    *{animation:none!important}
  }
</style>


<rect width="1200" height="180" rx="22" fill="var(--soft)"/>
<rect x="1" y="1" width="1198" height="178" rx="21" fill="none" stroke="var(--line)"/>
<text x="54" y="64" font-size="15" class="mono" font-weight="700" fill="var(--teal)">04 / ENGINEERING SIGNALS</text>
<text x="54" y="110" font-size="34" font-weight="700">Evidence over decoration.</text>
<g transform="translate(690 36)">
  <g>
    <text x="0" y="34" font-size="28" font-weight="700" fill="var(--indigo)">200+</text>
    <text x="0" y="58" font-size="12" class="muted">DSA Problems</text>
  </g>
  <g transform="translate(150 0)">
    <text x="0" y="34" font-size="20" font-weight="700" fill="var(--teal)">1st Runner-Up</text>
    <text x="0" y="58" font-size="12" class="muted">Hack The Knight</text>
  </g>
  <g transform="translate(350 0)">
    <text x="0" y="34" font-size="22" font-weight="700" fill="var(--violet)">AI / ML</text>
    <text x="0" y="58" font-size="12" class="muted">Applied Projects</text>
  </g>
  <path d="M0 86H430" stroke="var(--line)"/>
  <circle cx="8" cy="86" r="4" class="fill-indigo" style="animation:pulse 2.4s ease-in-out infinite"/>
  <circle cx="160" cy="86" r="4" class="fill-teal" style="animation:pulse 2.4s ease-in-out infinite .4s"/>
  <circle cx="360" cy="86" r="4" class="fill-violet" style="animation:pulse 2.4s ease-in-out infinite .8s"/>
</g>

</svg>