<svg xmlns="http://www.w3.org/2000/svg" width="1117" height="684" viewBox="0 0 1117 684" role="img" aria-label="Engineering Signals">

<style>
:root{
  --bg:#f4f7fb;
  --grid:#dfe6ef;
  --card:#ffffff;
  --panel:#edf6f9;
  --ink:#17233d;
  --muted:#64738d;
  --blue:#415bb6;
  --teal:#118792;
  --violet:#7f6ab6;
  --line:#cfd8e5;
  --soft:#e8eefb;
}
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes drift{to{stroke-dashoffset:-120}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes softmove{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
    <path d="M72 0H0V72" fill="none" stroke="var(--grid)" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#5f718c" flood-opacity=".10"/>
  </filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fb"/>
    <stop offset=".72" stop-color="#eef6fb"/>
    <stop offset="1" stop-color="#eaf8f5"/>
  </linearGradient>
  <linearGradient id="wash2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dfeafa"/>
    <stop offset="1" stop-color="#dff5f1"/>
  </linearGradient>
</defs>

<rect width="1117" height="684" fill="var(--bg)"/>
<rect width="1117" height="684" fill="url(#grid)" opacity=".9"/>
<text x="19" y="21" class="mono" font-size="14" font-weight="800" letter-spacing="4" fill="var(--teal)">04 / ENGINEERING SIGNALS</text>
<text x="309" y="31" class="serif" font-size="35" font-weight="700">Evidence of Practice</text>
<line x1="619" y1="16" x2="1117" y2="16" stroke="var(--line)"/>
<g filter="url(#shadow)">
  <rect x="19" y="74" width="1098" height="524" rx="28" fill="#f8fafc" stroke="#aebdce"/>
</g>
<line x1="570" y1="74" x2="570" y2="598" stroke="var(--line)"/>
<line x1="19" y1="336" x2="1117" y2="336" stroke="var(--line)"/>

<text x="57" y="146" font-size="37" font-weight="700" fill="#20386f">200+</text>
<text x="57" y="188" font-size="17" font-weight="700">DSA Problems Solved</text>
<text x="57" y="218" font-size="15" fill="var(--muted)">Consistent algorithmic problem-solving practice.</text>

<text x="609" y="146" font-size="36" font-weight="700" fill="#20386f">1st Runner-Up</text>
<text x="609" y="188" font-size="17" font-weight="700">National Hackathon</text>
<text x="609" y="218" font-size="15" fill="var(--muted)">Hack The Knight — collaborative delivery under constraints.</text>

<text x="57" y="410" font-size="36" font-weight="700" fill="#20386f">AI / ML</text>
<text x="57" y="451" font-size="17" font-weight="700">Applied Project Experience</text>
<text x="57" y="481" font-size="15" fill="var(--muted)">NLP, semantic matching, and classification use cases.</text>

<text x="609" y="410" font-size="36" font-weight="700" fill="#20386f">Full Stack</text>
<text x="609" y="451" font-size="17" font-weight="700">End-to-End Development</text>
<text x="609" y="481" font-size="15" fill="var(--muted)">DSA · OOP · DBMS · OS</text>

</svg>