<svg xmlns="http://www.w3.org/2000/svg" width="1117" height="718" viewBox="0 0 1117 718" role="img" aria-label="Certifications and Connect">

<style>
:root{
  --bg:#f4f7fb;
  --grid:#dfe6ef;
  --card:#ffffff;
  --panel:#edf6f9;
  --ink:#17233d;
  --muted:#64738d;
  --blue:#415bb6;
  --teal:#118792;
  --violet:#7f6ab6;
  --line:#cfd8e5;
  --soft:#e8eefb;
}
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes drift{to{stroke-dashoffset:-120}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes softmove{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
    <path d="M72 0H0V72" fill="none" stroke="var(--grid)" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#5f718c" flood-opacity=".10"/>
  </filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fb"/>
    <stop offset=".72" stop-color="#eef6fb"/>
    <stop offset="1" stop-color="#eaf8f5"/>
  </linearGradient>
  <linearGradient id="wash2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dfeafa"/>
    <stop offset="1" stop-color="#dff5f1"/>
  </linearGradient>
</defs>

<rect width="1117" height="718" fill="var(--bg)"/>
<rect width="1117" height="718" fill="url(#grid)" opacity=".9"/>
<text x="19" y="57" class="mono" font-size="14" font-weight="800" letter-spacing="4" fill="var(--teal)">05 / CREDENTIALS</text>
<text x="218" y="65" class="serif" font-size="34" font-weight="700">Certifications</text>
<line x1="433" y1="52" x2="1117" y2="52" stroke="var(--line)"/>

<g filter="url(#shadow)">
  <rect x="18" y="111" width="539" height="124" rx="21" fill="var(--card)" stroke="var(--line)"/>
  <rect x="582" y="111" width="535" height="124" rx="21" fill="var(--card)" stroke="var(--line)"/>
</g>
<rect x="50" y="143" width="61" height="61" rx="16" fill="#e9edff"/>
<path d="M67 178c-7 0-12-5-12-11s5-11 12-11c4 0 8 2 10 5 2-1 4-2 7-2 6 0 11 4 11 10 0 5-5 9-11 9z" fill="none" stroke="var(--blue)" stroke-width="3"/>
<text x="132" y="163" font-size="15" font-weight="700" fill="var(--muted)">Oracle Cloud Infrastructure</text>
<text x="132" y="191" font-size="17" font-weight="700">AI Foundations Associate</text>

<rect x="614" y="143" width="61" height="61" rx="16" fill="#e9edff"/>
<circle cx="645" cy="173" r="15" fill="none" stroke="var(--blue)" stroke-width="3"/>
<path d="M638 173l5 5 9-11" fill="none" stroke="var(--blue)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<text x="697" y="163" font-size="15" font-weight="700" fill="var(--muted)">IBM</text>
<text x="697" y="191" font-size="17" font-weight="700">Machine Learning Certification</text>

<g filter="url(#shadow)">
  <rect x="18" y="359" width="1099" height="294" rx="28" fill="url(#wash)" stroke="var(--line)"/>
</g>
<text x="69" y="447" class="serif" font-size="33" font-weight="700">Connect</text>
<text x="69" y="485" font-size="18" fill="var(--muted)">Professional profiles and coding practice.</text>

<g>
  <rect x="69" y="531" width="157" height="70" rx="15" fill="var(--card)" stroke="var(--line)"/>
  <text x="92" y="577" font-size="27" font-weight="700">in</text><text x="139" y="571" font-size="17" font-weight="700">LinkedIn</text>
  <rect x="241" y="531" width="146" height="70" rx="15" fill="var(--card)" stroke="var(--line)"/>
  <text x="264" y="577" font-size="25" font-weight="700">GH</text><text x="309" y="571" font-size="17" font-weight="700">GitHub</text>
  <rect x="402" y="531" width="168" height="70" rx="15" fill="var(--card)" stroke="var(--line)"/>
  <text x="424" y="577" font-size="24" font-weight="700">&lt;/&gt;</text><text x="470" y="571" font-size="17" font-weight="700">LeetCode</text>
  <rect x="585" y="531" width="132" height="70" rx="15" fill="var(--card)" stroke="var(--line)"/>
  <rect x="608" y="552" width="32" height="25" rx="3" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <path d="M608 554l16 13 16-13" fill="none" stroke="var(--ink)" stroke-width="3"/>
  <text x="652" y="571" font-size="17" font-weight="700">Email</text>
</g>

</svg>