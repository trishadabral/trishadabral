<svg xmlns="http://www.w3.org/2000/svg" width="1189" height="788" viewBox="0 0 1189 788" role="img" aria-label="Selected Work Smart Resume Analyzer">

<style>
:root{
  --bg:#f4f7fb;
  --grid:#dfe6ef;
  --card:#ffffff;
  --panel:#edf6f9;
  --ink:#17233d;
  --muted:#64738d;
  --blue:#415bb6;
  --teal:#118792;
  --violet:#7f6ab6;
  --line:#cfd8e5;
  --soft:#e8eefb;
}
text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:var(--ink)}
.serif{font-family:Georgia,"Times New Roman",serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@keyframes drift{to{stroke-dashoffset:-120}}
@keyframes pulse{0%,100%{opacity:.42}50%{opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes softmove{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
  <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
    <path d="M72 0H0V72" fill="none" stroke="var(--grid)" stroke-width="1"/>
  </pattern>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="15" stdDeviation="20" flood-color="#5f718c" flood-opacity=".10"/>
  </filter>
  <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#eef4fb"/>
    <stop offset=".72" stop-color="#eef6fb"/>
    <stop offset="1" stop-color="#eaf8f5"/>
  </linearGradient>
  <linearGradient id="wash2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#dfeafa"/>
    <stop offset="1" stop-color="#dff5f1"/>
  </linearGradient>
</defs>

<rect width="1189" height="788" fill="var(--bg)"/>
<rect width="1189" height="788" fill="url(#grid)" opacity=".75"/>
<g filter="url(#shadow)">
  <rect x="39" y="8" width="1104" height="364" rx="0 0 29 29" fill="url(#wash2)" stroke="var(--line)"/>
</g>
<path d="M874 8c0 0-2 77-7 110-7 51 28 93 70 112 43 19 116 16 206 9" fill="none" stroke="#aac6e5" stroke-width="1.4"/>
<circle cx="186" cy="339" r="97" fill="none" stroke="#9bc9d5" stroke-width="1.4"/>

<text x="87" y="74" font-size="17" font-weight="700">Problem</text>
<text x="87" y="107" font-size="17" fill="var(--muted)">Learning support often lacks context, pacing, and clear explanations.</text>
<line x1="87" y1="137" x2="1094" y2="137" stroke="#b8c6d9"/>
<text x="87" y="178" font-size="17" font-weight="700">Engineering</text>
<text x="87" y="211" font-size="17" fill="var(--muted)">Full-stack interaction flow, API design, and clean backend orchestration.</text>
<line x1="87" y1="241" x2="1094" y2="241" stroke="#b8c6d9"/>
<text x="87" y="282" font-size="17" font-weight="700">AI Application</text>
<text x="87" y="315" font-size="17" fill="var(--muted)">Language-aware processing supports tailored academic guidance.</text>

<g filter="url(#shadow)"><rect x="39" y="396" width="1104" height="392" rx="28" fill="var(--card)" stroke="#8ecad2"/></g>
<path d="M926 396c0 0-1 90 36 132 37 42 86 57 181 58" fill="none" stroke="#d1c7e8" stroke-width="1.3"/>
<text x="80" y="453" class="mono" font-size="14" font-weight="800" letter-spacing="4" fill="var(--teal)">02 / AI + DOCUMENT PROCESSING</text>
<text x="80" y="511" class="serif" font-size="27" font-weight="700">Smart Resume Analyzer</text>
<text x="80" y="547" font-size="21" font-weight="700" fill="var(--blue)">NLP-based semantic matching and ATS-style candidate scoring</text>
<text x="80" y="599" font-size="17" fill="var(--muted)">An AI-powered resume analysis platform that extracts PDF content, processes candidate information, and</text>
<text x="80" y="623" font-size="17" fill="var(--muted)">compares semantic relevance against role requirements. The engineering focus is a practical pipeline for</text>
<text x="80" y="647" font-size="17" fill="var(--muted)">NLP processing, similarity scoring, and backend architecture.</text>
<text x="80" y="707" font-size="21" font-weight="700" fill="var(--teal)">Py</text><text x="116" y="707" font-size="16" fill="var(--muted)">Python</text>
<text x="181" y="707" font-size="22" fill="var(--muted)">⧉</text><text x="226" y="707" font-size="16" fill="var(--muted)">Semantic Similarity</text>
<text x="379" y="707" font-size="22" fill="var(--muted)">▣</text><text x="421" y="707" font-size="16" fill="var(--muted)">PDF Processing</text>
<text x="544" y="707" font-size="21" fill="var(--teal)">◔</text><text x="580" y="707" font-size="16" fill="var(--muted)">Flask</text>
<text x="80" y="782" font-size="16" font-weight="700" fill="var(--teal)">View Repository</text>

</svg>